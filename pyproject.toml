[project]
name = "orchestrator-worker-travel-agent"
version = "0.1.0"
description = "An implementation of orchestrator-worker AI engineering pattern"
authors = [
    {name = "Daria Naumova",email = "darianaumova5@gmail.com"}
]
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "langfuse (>=4.7.1,<5.0.0)",
    "langchain (>=1.3.4,<2.0.0)",
    "langgraph (>=1.2.4,<2.0.0)",
    "langchain-anthropic (>=1.4.4,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi[standard] (>=0.137.1,<0.138.0)",
    "langgraph-checkpoint-sqlite (>=3.1.0,<4.0.0)",
    "a2ui-core (>=0.1.1,<0.2.0)",
    "tavily-python (>=0.8.0,<0.9.0)"
]


[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
